<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softgreen · Invoice Generator</title>
    <!-- Font Awesome & html2pdf -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e6e9f0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-wrapper {
            max-width: 1300px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        .form-card {
            flex: 1 1 420px;
            background: white;
            border-radius: 28px;
            padding: 28px 30px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }
        .form-card h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 1.8rem;
            color: #1a3e2f;
            border-bottom: 3px solid #2b6e4f;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        .form-card h2 i { color: #2b6e4f; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }
        .form-grid .full-width { grid-column: 1 / -1; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f3d31;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group label i { color: #2b6e4f; width: 18px; }
        .form-group input, .form-group select {
            padding: 10px 14px;
            border: 1.5px solid #d0d7de;
            border-radius: 14px;
            font-size: 0.95rem;
            background: #fafcff;
            transition: 0.15s;
            width: 100%;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #2b6e4f;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(43, 110, 79, 0.15);
        }
        .item-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f2f6f9;
            padding: 14px 16px;
            border-radius: 20px;
            margin-top: 6px;
            align-items: flex-end;
        }
        .item-row .form-group { flex: 1 0 100px; }
        .item-row .form-group.small { flex: 0 1 80px; }
        .item-row .form-group.mid { flex: 2 0 130px; }
        .btn-icon {
            background: #2b6e4f;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            box-shadow: 0 4px 8px rgba(43, 110, 79, 0.2);
        }
        .btn-icon:hover { background: #1f533c; transform: scale(0.97); }
        .btn-icon.outline {
            background: transparent;
            color: #1f3d31;
            border: 2px solid #d0d7de;
            box-shadow: none;
        }
        .btn-icon.outline:hover { background: #eef3f6; border-color: #2b6e4f; }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            gap: 12px;
        }
        .cash-row {
            background: #f0f5f2;
            border-radius: 20px;
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 20px;
            margin-top: 12px;
        }
        .cash-row .form-group { flex: 1 0 120px; }
        .badge-total {
            background: #1a3e2f;
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .remove-item {
            background: #d45c5c;
            border: none;
            color: white;
            border-radius: 30px;
            padding: 0 12px;
            height: 38px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.1s;
        }
        .remove-item:hover { background: #b14141; }

        .preview-card {
            flex: 1 1 520px;
            background: #f8fafc;
            border-radius: 28px;
            padding: 20px 20px 30px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .preview-header h2 {
            font-weight: 500;
            color: #1a3e2f;
            font-size: 1.6rem;
        }
        .preview-header h2 i { color: #2b6e4f; margin-right: 8px; }
        .pdf-container {
            background: white;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #dce3e9;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            overflow: hidden;
        }
        #invoice-preview {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: white;
            color: #1e2b32;
            font-size: 13px;
            line-height: 1.5;
            width: 100%;
            padding: 20px 24px;
            box-sizing: border-box;
        }
        .inv-store { font-weight: 700; font-size: 1.7rem; letter-spacing: -0.3px; color: #0f2b1f; }
        .inv-address { color: #2c4a3b; font-size: 0.95rem; }
        .inv-vat { font-size: 0.85rem; color: #3b5b49; }
        .inv-title {
            font-weight: 600;
            font-size: 1.2rem;
            color: #1c3d2d;
            border-bottom: 2px dashed #bcccd2;
            padding-bottom: 6px;
            margin: 6px 0 12px;
        }
        .inv-row { display: flex; justify-content: space-between; font-size: 0.92rem; padding: 2px 0; }
        .inv-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 6px;
            font-size: 0.9rem;
        }
        .inv-table th { text-align: left; border-bottom: 2px solid #1a3e2f; padding: 6px 4px; color: #17382a; font-weight: 600; }
        .inv-table td { padding: 5px 4px; border-bottom: 1px solid #e2e9ef; }
        .inv-table .amount-col { text-align: right; }
        .inv-cash {
            background: #ecf3ef;
            padding: 8px 14px;
            border-radius: 20px;
            display: inline-flex;
            gap: 28px;
            margin: 12px 0 6px;
            font-weight: 500;
        }
        .inv-footer {
            border-top: 1px solid #cbd8df;
            margin-top: 16px;
            padding-top: 12px;
            font-size: 0.9rem;
            color: #2c4a3b;
            display: flex;
            justify-content: space-between;
        }
        .inv-amount-words {
            font-weight: 500;
            background: #f2f7f3;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.9rem;
        }
        .download-btn {
            background: #1f533c;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            box-shadow: 0 6px 14px rgba(31, 83, 60, 0.3);
            width: 100%;
        }
        .download-btn i { font-size: 1.4rem; }
        .download-btn:hover { background: #0f3929; transform: scale(0.98); }
        @media (max-width: 800px) {
            .form-grid { grid-template-columns: 1fr; }
            .item-row { flex-direction: column; }
        }
        #invoice-preview * { box-sizing: border-box; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="form-card">
        <h2><i class="fas fa-receipt"></i> Invoice details</h2>
        <div class="form-grid">
            <div class="form-group"><label><i class="fas fa-hashtag"></i> Bill No.</label><input id="billNo" value="SI51942-CHR-82/83"></div>
            <div class="form-group"><label><i class="fas fa-calendar-day"></i> Date</label><input id="billDate" type="text" value="07/02/2026"></div>
            <div class="form-group"><label><i class="fas fa-calendar-alt"></i> Miti</label><input id="miti" value="18/03/2083"></div>
            <div class="form-group"><label><i class="fas fa-user"></i> Name</label><input id="custName" placeholder="Customer name"></div>
            <div class="form-group"><label><i class="fas fa-map-pin"></i> Address</label><input id="custAddress" placeholder="Address"></div>
            <div class="form-group"><label><i class="fas fa-id-card"></i> PAN No</label><input id="panNo" placeholder="PAN"></div>
            <div class="form-group full-width"><label><i class="fas fa-money-bill-wave"></i> Payment Mode</label>
                <select id="paymentMode"><option value="Cash">Cash</option><option value="Card">Card</option><option value="Mobile">Mobile</option></select>
            </div>
        </div>

        <div style="margin: 18px 0 6px; font-weight: 600; color: #1f3d31;"><i class="fas fa-shopping-basket"></i> Items</div>
        <div id="itemsContainer">
            <!-- First item - ALL FIELDS EMPTY -->
            <div class="item-row" data-index="0">
                <div class="form-group mid"><label>Particulars</label><input class="item-particulars" placeholder="Item description" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Qty</label><input class="item-qty" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Rate</label><input class="item-rate" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Amount</label><input class="item-amount" type="number" step="0.01" readonly style="background:#eef4f0;" value="0.00"></div>
                <button class="remove-item" onclick="removeItem(this)"><i class="fas fa-trash-alt"></i></button>
            </div>
            <!-- Second item - ALL FIELDS EMPTY -->
            <div class="item-row" data-index="1">
                <div class="form-group mid"><label>Particulars</label><input class="item-particulars" placeholder="Item description" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Qty</label><input class="item-qty" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Rate</label><input class="item-rate" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Amount</label><input class="item-amount" type="number" step="0.01" readonly style="background:#eef4f0;" value="0.00"></div>
                <button class="remove-item" onclick="removeItem(this)"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>
        <button class="btn-icon outline" style="margin: 8px 0 12px;" onclick="addItem()"><i class="fas fa-plus-circle"></i> Add item</button>

        <div class="cash-row">
            <div class="form-group"><label><i class="fas fa-hand-holding-usd"></i> Tender / Cash</label><input id="tenderCash" type="number" step="0.01" value="0.00"></div>
            <div class="form-group"><label><i class="fas fa-coins"></i> Change</label><input id="changeCash" type="number" step="0.01" value="0.00" readonly style="background:#eef4f0;"></div>
            <div class="badge-total"><i class="fas fa-calculator"></i> Net: <span id="netTotalDisplay">0.00</span></div>
        </div>

        <div class="action-bar">
            <button class="btn-icon" onclick="updatePreview()"><i class="fas fa-eye"></i> Refresh preview</button>
            <span style="color:#4b6a5a; font-size:0.85rem;"><i class="fas fa-arrow-right"></i> auto‑update</span>
        </div>
    </div>

    <div class="preview-card">
        <div class="preview-header">
            <h2><i class="fas fa-file-pdf"></i> Invoice preview</h2>
            <span style="background:#dce9e0; padding:4px 16px; border-radius:40px; font-size:0.8rem; font-weight:500;">A5 · full bleed</span>
        </div>
        <div class="pdf-container" id="pdfContainer">
            <div id="invoice-preview"></div>
        </div>
        <button class="download-btn" id="downloadPdfBtn"><i class="fas fa-cloud-download-alt"></i> Download PDF (A5)</button>
    </div>
</div>

<script>
    (function() {
        function recalcItemAmount(row) {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const amt = qty * rate;
            row.querySelector('.item-amount').value = amt.toFixed(2);
            return amt;
        }

        function computeTotal() {
            let total = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                total += recalcItemAmount(row);
            });
            return total;
        }

        function updateNetAndChange() {
            const net = computeTotal();
            document.getElementById('netTotalDisplay').textContent = net.toFixed(2);
            const tender = parseFloat(document.getElementById('tenderCash').value) || 0;
            document.getElementById('changeCash').value = (tender - net).toFixed(2);
            return net;
        }

        window.addItem = function() {
            const container = document.getElementById('itemsContainer');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <div class="form-group mid"><label>Particulars</label><input class="item-particulars" placeholder="Item description" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Qty</label><input class="item-qty" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Rate</label><input class="item-rate" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Amount</label><input class="item-amount" type="number" step="0.01" readonly style="background:#eef4f0;" value="0.00"></div>
                <button class="remove-item" onclick="removeItem(this)"><i class="fas fa-trash-alt"></i></button>
            `;
            container.appendChild(row);
            row.querySelectorAll('.item-qty, .item-rate').forEach(inp => {
                inp.addEventListener('input', function() { updateNetAndChange(); updatePreview(); });
            });
            row.querySelector('.item-particulars').addEventListener('input', updatePreview);
            updateNetAndChange();
            updatePreview();
        };

        window.removeItem = function(btn) {
            const row = btn.closest('.item-row');
            if (document.querySelectorAll('.item-row').length > 1) {
                row.remove();
                updateNetAndChange();
                updatePreview();
            } else { alert('At least one item is required.'); }
        };

        function attachInputEvents() {
            document.querySelectorAll('.item-row').forEach(row => {
                row.querySelectorAll('.item-qty, .item-rate').forEach(inp => {
                    inp.addEventListener('input', function() { updateNetAndChange(); updatePreview(); });
                });
                row.querySelector('.item-particulars').addEventListener('input', updatePreview);
            });
            document.getElementById('tenderCash').addEventListener('input', function() { updateNetAndChange(); updatePreview(); });
            document.querySelectorAll('#billNo, #billDate, #miti, #custName, #custAddress, #panNo, #paymentMode').forEach(el => {
                el.addEventListener('input', updatePreview);
            });
            document.getElementById('paymentMode').addEventListener('change', updatePreview);
        }

        function updatePreview() {
            const net = updateNetAndChange();
            const billNo = document.getElementById('billNo').value || 'SI51942-CHR-82/83';
            const date = document.getElementById('billDate').value || '07/02/2026';
            const miti = document.getElementById('miti').value || '18/03/2083';
            const name = document.getElementById('custName').value || ' ';
            const address = document.getElementById('custAddress').value || ' ';
            const pan = document.getElementById('panNo').value || ' ';
            const payment = document.getElementById('paymentMode').value || 'Cash';
            const tender = parseFloat(document.getElementById('tenderCash').value) || 0;
            const change = parseFloat(document.getElementById('changeCash').value) || 0;

            let itemsHtml = '';
            let gross = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                const particulars = row.querySelector('.item-particulars').value || '—';
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const amt = qty * rate;
                gross += amt;
                itemsHtml += `<tr><td>${particulars}</td><td>${qty.toFixed(2)}</td><td>${rate.toFixed(2)}</td><td class="amount-col">${amt.toFixed(2)}</td></tr>`;
            });

            const words = numberToWords(gross);
            const preview = document.getElementById('invoice-preview');
            preview.innerHTML = `
                <div style="margin-bottom:6px;">
                    <div class="inv-store">SOFTGREEN TRADING PVT. LTD.</div>
                    <div class="inv-address">Chapagaun-11, Godawarī</div>
                    <div class="inv-vat">VAT No. : 600595539</div>
                    <div class="inv-title">ABBREVIATED TAX INVOICE</div>
                </div>
                <div style="display:flex; flex-wrap:wrap; justify-content:space-between; border-bottom:1px solid #d0dce3; padding-bottom:6px; margin-bottom:8px;">
                    <span><strong>Bill No:</strong> ${billNo}</span>
                    <span><strong>Date :</strong> ${date}</span>
                    <span><strong>Miti :</strong> ${miti}</span>
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:8px 20px; font-size:0.9rem; margin:4px 0 6px;">
                    <span><strong>Name :</strong> ${name}</span>
                    <span><strong>Address :</strong> ${address}</span>
                    <span><strong>PAN No :</strong> ${pan}</span>
                    <span><strong>Payment Mode :</strong> ${payment}</span>
                </div>
                <table class="inv-table">
                    <thead><tr><th>Particulars</th><th>Qty</th><th>Rate</th><th class="amount-col">Amount</th></tr></thead>
                    <tbody>${itemsHtml}</tbody>
                </table>
                <div style="margin:6px 0;">
                    <div class="inv-row"><span>Gross Amount :</span><span>${gross.toFixed(2)}</span></div>
                    <div class="inv-row"><span>Discount :</span><span>0.00</span></div>
                    <div class="inv-row" style="font-weight:700; border-top:1px solid #1a3e2f; padding-top:4px;"><span>Net Amount :</span><span>${gross.toFixed(2)}</span></div>
                </div>
                <div class="inv-cash">
                    <span><strong>Tender :</strong> ${tender.toFixed(2)}</span>
                    <span><strong>Change :</strong> ${change.toFixed(2)}</span>
                </div>
                <div class="inv-amount-words"><i class="fas fa-pen-fancy"></i> Rs. ${words} only</div>
                <div class="inv-footer">
                    <span>Counter : Chapagaun ( 2:59PM ) Retail Terminal 1</span>
                    <span>Cashier : chapagaun</span>
                </div>
                <div style="text-align:center; font-size:0.75rem; color:#4b6a5a; margin-top:10px;">Thank you for visiting us.</div>
            `;
        }

        function numberToWords(n) {
            if (n === 0) return 'Zero';
            const num = Math.round(n * 100) / 100;
            const whole = Math.floor(num);
            const frac = Math.round((num - whole) * 100);
            const units = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            function convert(h) {
                if (h < 20) return units[h];
                if (h < 100) return tens[Math.floor(h/10)] + (h%10 ? ' ' + units[h%10] : '');
                return units[Math.floor(h/100)] + ' Hundred' + (h%100 ? ' ' + convert(h%100) : '');
            }
            let res = '';
            let w = whole;
            if (w >= 1000) { res += convert(Math.floor(w/1000)) + ' Thousand '; w %= 1000; }
            if (w > 0) res += convert(w) + ' ';
            if (frac > 0) res += 'and ' + frac + ' Paisa';
            else res += 'only';
            return res.trim();
        }

        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            const element = document.getElementById('invoice-preview');
            const opt = {
                margin:        [0.2, 0.2, 0.2, 0.2],
                filename:     'Softgreen_Invoice_A5.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, letterRendering: true, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a5', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        });

        // Force clear any cached values on load
        document.querySelectorAll('.item-particulars, .item-qty, .item-rate').forEach(el => {
            el.value = '';
        });
        
        attachInputEvents();
        updateNetAndChange();
        updatePreview();
    })();
</script>
</body>
</html>
