<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Town Mart · Invoice Generator</title>
    <!-- Font Awesome & html2pdf -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e6e9f0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-wrapper {
            max-width: 1300px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        .form-card {
            flex: 1 1 420px;
            background: white;
            border-radius: 28px;
            padding: 28px 30px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }
        .form-card h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 1.8rem;
            color: #1a3e2f;
            border-bottom: 3px solid #2b6e4f;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        .form-card h2 i { color: #2b6e4f; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }
        .form-grid .full-width { grid-column: 1 / -1; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f3d31;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group label i { color: #2b6e4f; width: 18px; }
        .form-group input, .form-group select {
            padding: 10px 14px;
            border: 1.5px solid #d0d7de;
            border-radius: 14px;
            font-size: 0.95rem;
            background: #fafcff;
            transition: 0.15s;
            width: 100%;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #2b6e4f;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(43, 110, 79, 0.15);
        }
        .item-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f2f6f9;
            padding: 14px 16px;
            border-radius: 20px;
            margin-top: 6px;
            align-items: flex-end;
        }
        .item-row .form-group { flex: 1 0 100px; }
        .item-row .form-group.small { flex: 0 1 80px; }
        .item-row .form-group.mid { flex: 2 0 130px; }
        .btn-icon {
            background: #2b6e4f;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            box-shadow: 0 4px 8px rgba(43, 110, 79, 0.2);
        }
        .btn-icon:hover { background: #1f533c; transform: scale(0.97); }
        .btn-icon.outline {
            background: transparent;
            color: #1f3d31;
            border: 2px solid #d0d7de;
            box-shadow: none;
        }
        .btn-icon.outline:hover { background: #eef3f6; border-color: #2b6e4f; }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            gap: 12px;
        }
        .cash-row {
            background: #f0f5f2;
            border-radius: 20px;
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 20px;
            margin-top: 12px;
        }
        .cash-row .form-group { flex: 1 0 120px; }
        .badge-total {
            background: #1a3e2f;
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .remove-item {
            background: #d45c5c;
            border: none;
            color: white;
            border-radius: 30px;
            padding: 0 12px;
            height: 38px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.1s;
        }
        .remove-item:hover { background: #b14141; }

        .preview-card {
            flex: 1 1 520px;
            background: #f8fafc;
            border-radius: 28px;
            padding: 20px 20px 30px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .preview-header h2 {
            font-weight: 500;
            color: #1a3e2f;
            font-size: 1.6rem;
        }
        .preview-header h2 i { color: #2b6e4f; margin-right: 8px; }
        .pdf-container {
            background: white;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #dce3e9;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            overflow: auto;
        }
        #invoice-preview {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: white;
            color: #1e2b32;
            font-size: 13px;
            line-height: 1.5;
            width: 100%;
            padding: 20px 24px;
            box-sizing: border-box;
        }
        
        /* Responsive styles for invoice preview */
        @media screen and (max-width: 1024px) {
            #invoice-preview {
                font-size: 12px;
                padding: 18px 20px;
            }
        }
        
        @media screen and (max-width: 768px) {
            #invoice-preview {
                font-size: 11px;
                padding: 12px 16px;
            }
            .inv-store { font-size: 1.3rem !important; }
            .inv-title { font-size: 1rem !important; }
            .inv-table { font-size: 0.8rem !important; }
            .inv-cash { flex-direction: row; flex-wrap: wrap; gap: 12px; }
            .inv-footer { flex-direction: row; flex-wrap: wrap; gap: 4px; }
        }
        
        @media screen and (max-width: 480px) {
            #invoice-preview {
                font-size: 10px;
                padding: 10px 12px;
            }
            .inv-store { font-size: 1.1rem !important; }
            .inv-address { font-size: 0.8rem !important; }
            .inv-title { font-size: 0.9rem !important; }
            .inv-table { font-size: 0.7rem !important; }
            .inv-table th, .inv-table td { padding: 3px 2px !important; }
            .inv-cash { font-size: 0.8rem; flex-direction: column; gap: 4px; }
            .inv-amount-words { font-size: 0.75rem; }
            .inv-footer { font-size: 0.75rem; flex-direction: column; gap: 2px; }
        }
        
        .inv-store { font-weight: 700; font-size: 1.7rem; letter-spacing: -0.3px; color: #0f2b1f; }
        .inv-address { color: #2c4a3b; font-size: 0.95rem; }
        .inv-vat { font-size: 0.85rem; color: #3b5b49; }
        .inv-title {
            font-weight: 600;
            font-size: 1.2rem;
            color: #1c3d2d;
            border-bottom: 2px dashed #bcccd2;
            padding-bottom: 6px;
            margin: 6px 0 12px;
        }
        .inv-row { display: flex; justify-content: space-between; font-size: 0.92rem; padding: 2px 0; }
        .inv-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 6px;
            font-size: 0.9rem;
        }
        .inv-table th { 
            text-align: left; 
            border-bottom: 2px solid #1a3e2f; 
            padding: 6px 4px; 
            color: #17382a; 
            font-weight: 600; 
        }
        .inv-table td { padding: 5px 4px; border-bottom: 1px solid #e2e9ef; }
        .inv-table .amount-col { text-align: right; }
        .inv-cash {
            background: #ecf3ef;
            padding: 8px 14px;
            border-radius: 20px;
            display: flex;
            gap: 28px;
            margin: 12px 0 6px;
            font-weight: 500;
            flex-wrap: wrap;
        }
        .inv-footer {
            border-top: 1px solid #cbd8df;
            margin-top: 16px;
            padding-top: 12px;
            font-size: 0.9rem;
            color: #2c4a3b;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .inv-amount-words {
            font-weight: 500;
            background: #f2f7f3;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.9rem;
            word-break: break-word;
            max-width: 100%;
        }
        .download-btn {
            background: #1f533c;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            box-shadow: 0 6px 14px rgba(31, 83, 60, 0.3);
            width: 100%;
        }
        .download-btn i { font-size: 1.4rem; }
        .download-btn:hover { background: #0f3929; transform: scale(0.98); }
        .download-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        @media (max-width: 800px) {
            .form-grid { grid-template-columns: 1fr; }
            .item-row { flex-direction: column; }
        }
        #invoice-preview * { box-sizing: border-box; }
        
        /* Print and PDF specific styles */
        @media print {
            body { background: white; padding: 0; }
            .app-wrapper { display: block; }
            .form-card { display: none; }
            .preview-card { box-shadow: none; padding: 0; }
            .pdf-container { border: none; min-height: auto; }
            #invoice-preview { 
                padding: 15px 20px;
                font-size: 12px;
            }
            .download-btn { display: none; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="form-card">
        <h2><i class="fas fa-receipt"></i> Invoice details</h2>
        <div class="form-grid">
            <div class="form-group"><label><i class="fas fa-hashtag"></i> Bill No.</label><input id="billNo" value="SI51942-CHR-82/83"></div>
            <div class="form-group"><label><i class="fas fa-calendar-day"></i> Date</label><input id="billDate" type="date" value="2026-02-07"></div>
            <div class="form-group"><label><i class="fas fa-calendar-alt"></i> Miti (Nepali)</label><input id="miti" value="2082-10-25" readonly style="background:#eef4f0;"></div>
            <div class="form-group"><label><i class="fas fa-user"></i> Name</label><input id="custName" placeholder="Customer name"></div>
            <div class="form-group"><label><i class="fas fa-map-pin"></i> Address</label><input id="custAddress" placeholder="Address"></div>
            <div class="form-group"><label><i class="fas fa-id-card"></i> PAN No</label><input id="panNo" placeholder="PAN"></div>
            <div class="form-group full-width"><label><i class="fas fa-money-bill-wave"></i> Payment Mode</label>
                <select id="paymentMode"><option value="Cash">Cash</option><option value="Card">Card</option><option value="Mobile">Mobile</option></select>
            </div>
            <!-- New Cashier Name Field -->
            <div class="form-group full-width"><label><i class="fas fa-user-tie"></i> Cashier Name</label>
                <input id="cashierName" placeholder="Enter cashier name" value="Bikram Thapa">
            </div>
        </div>

        <div style="margin: 18px 0 6px; font-weight: 600; color: #1f3d31;"><i class="fas fa-shopping-basket"></i> Items</div>
        <div id="itemsContainer">
            <!-- First item - ALL FIELDS EMPTY -->
            <div class="item-row" data-index="0">
                <div class="form-group mid"><label>Particulars</label><input class="item-particulars" placeholder="Item description" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Qty</label><input class="item-qty" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Rate</label><input class="item-rate" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Amount</label><input class="item-amount" type="number" step="0.01" readonly style="background:#eef4f0;" value="0.00"></div>
                <button class="remove-item" onclick="removeItem(this)"><i class="fas fa-trash-alt"></i></button>
            </div>
            <!-- Second item - ALL FIELDS EMPTY -->
            <div class="item-row" data-index="1">
                <div class="form-group mid"><label>Particulars</label><input class="item-particulars" placeholder="Item description" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Qty</label><input class="item-qty" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Rate</label><input class="item-rate" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Amount</label><input class="item-amount" type="number" step="0.01" readonly style="background:#eef4f0;" value="0.00"></div>
                <button class="remove-item" onclick="removeItem(this)"><i class="fas fa-trash-alt"></i></button>
            </div>
        </div>
        <button class="btn-icon outline" style="margin: 8px 0 12px;" onclick="addItem()"><i class="fas fa-plus-circle"></i> Add item</button>

        <div class="cash-row">
            <div class="form-group"><label><i class="fas fa-hand-holding-usd"></i> Tender / Cash</label><input id="tenderCash" type="number" step="0.01" value="0.00"></div>
            <div class="form-group"><label><i class="fas fa-coins"></i> Change</label><input id="changeCash" type="number" step="0.01" value="0.00" readonly style="background:#eef4f0;"></div>
            <div class="badge-total"><i class="fas fa-calculator"></i> Net: <span id="netTotalDisplay">0.00</span></div>
        </div>

        <div class="action-bar">
            <button class="btn-icon" onclick="updatePreview()"><i class="fas fa-eye"></i> Refresh preview</button>
            <span style="color:#4b6a5a; font-size:0.85rem;"><i class="fas fa-arrow-right"></i> auto‑update</span>
        </div>
    </div>

    <div class="preview-card">
        <div class="preview-header">
            <h2><i class="fas fa-file-pdf"></i> Invoice preview</h2>
            <span style="background:#dce9e0; padding:4px 16px; border-radius:40px; font-size:0.8rem; font-weight:500;">A5 · full bleed</span>
        </div>
        <div class="pdf-container" id="pdfContainer">
            <div id="invoice-preview"></div>
        </div>
        <button class="download-btn" id="downloadPdfBtn"><i class="fas fa-cloud-download-alt"></i> Download PDF (A5)</button>
    </div>
</div>

<script>
    (function() {
        // Corrected Nepali Date Conversion
        // Reference: 2000-01-01 AD = 2056-09-17 BS
        const nepaliMonthDays = [
            [30, 32, 31, 32, 31, 30, 30, 30, 29, 29, 30, 30], // Non-leap year
            [30, 32, 31, 32, 31, 30, 30, 30, 30, 30, 30, 30]  // Leap year
        ];

        const nepaliMonths = [
            'Baishakh', 'Jestha', 'Ashadh', 'Shrawan', 'Bhadra', 'Ashwin',
            'Kartik', 'Mangsir', 'Poush', 'Magh', 'Falgun', 'Chaitra'
        ];

        function isNepaliLeapYear(year) {
            // Nepali leap year calculation
            const remainder = year % 4;
            if (remainder === 0) return true;
            if (remainder === 2) {
                const yearMod100 = year % 100;
                if (yearMod100 === 0) return true;
                if (yearMod100 === 4) return true;
                if (yearMod100 === 8) return true;
            }
            return false;
        }

        function getNepaliMonthDays(year, month) {
            // month is 0-indexed (0 = Baishakh)
            const leap = isNepaliLeapYear(year) ? 1 : 0;
            return nepaliMonthDays[leap][month];
        }

        function englishToNepali(englishDate) {
            if (!englishDate) return '2082-10-25';
            
            const parts = englishDate.split('-');
            if (parts.length !== 3) return '2082-10-25';
            
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            const day = parseInt(parts[2]);
            
            // Reference date: 2000-01-01 AD = 2056-09-17 BS
            const refEnglish = new Date(2000, 0, 1);
            const targetEnglish = new Date(year, month, day);
            
            // Calculate days difference
            const diffTime = targetEnglish.getTime() - refEnglish.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // Start from reference BS date
            let bsYear = 2056;
            let bsMonth = 8; // September (0-indexed, 8 = Kartik? Let me re-check)
            let bsDay = 17;
            
            // Actually, let's adjust: 2000-01-01 AD = 2056-09-17 BS
            // BS month 9 means Kartik? Let's use 0-indexed months properly
            // BS months: 0=Baishakh, 1=Jestha, 2=Ashadh, 3=Shrawan, 4=Bhadra, 5=Ashwin, 
            // 6=Kartik, 7=Mangsir, 8=Poush, 9=Magh, 10=Falgun, 11=Chaitra
            // 2056-09-17 BS = 2056 Magh 17? No, let me recalculate.
            // Actually, the correct mapping: 2000-01-01 AD = 2056-09-17 BS
            // 09 means Poush? Let me be careful.
            // In Nepali calendar: Baishakh(0), Jestha(1), Ashadh(2), Shrawan(3), Bhadra(4), 
            // Ashwin(5), Kartik(6), Mangsir(7), Poush(8), Magh(9), Falgun(10), Chaitra(11)
            // So 09 = Magh
            
            let bsYearRef = 2056;
            let bsMonthRef = 8; // Poush (8)
            let bsDayRef = 17;
            
            let remainingDays = diffDays;
            
            // Move forward or backward in BS
            if (remainingDays >= 0) {
                // Move forward
                let currentYear = bsYearRef;
                let currentMonth = bsMonthRef;
                let currentDay = bsDayRef;
                
                while (remainingDays > 0) {
                    const daysInMonth = getNepaliMonthDays(currentYear, currentMonth);
                    if (remainingDays >= daysInMonth - currentDay + 1) {
                        remainingDays -= (daysInMonth - currentDay + 1);
                        currentDay = 1;
                        currentMonth++;
                        if (currentMonth >= 12) {
                            currentMonth = 0;
                            currentYear++;
                        }
                    } else {
                        currentDay += remainingDays;
                        remainingDays = 0;
                    }
                }
                
                return `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(currentDay).padStart(2, '0')}`;
            } else {
                // Move backward
                let currentYear = bsYearRef;
                let currentMonth = bsMonthRef;
                let currentDay = bsDayRef;
                remainingDays = Math.abs(remainingDays);
                
                while (remainingDays > 0) {
                    if (remainingDays >= currentDay) {
                        remainingDays -= currentDay;
                        currentMonth--;
                        if (currentMonth < 0) {
                            currentMonth = 11;
                            currentYear--;
                        }
                        currentDay = getNepaliMonthDays(currentYear, currentMonth);
                    } else {
                        currentDay -= remainingDays;
                        remainingDays = 0;
                    }
                }
                
                return `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(currentDay).padStart(2, '0')}`;
            }
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            const year = parts[0];
            const month = parts[1];
            const day = parts[2];
            return `${day}/${month}/${year}`;
        }

        // Main functions
        function recalcItemAmount(row) {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const amt = qty * rate;
            row.querySelector('.item-amount').value = amt.toFixed(2);
            return amt;
        }

        function computeTotal() {
            let total = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                total += recalcItemAmount(row);
            });
            return total;
        }

        function updateNetAndChange() {
            const net = computeTotal();
            document.getElementById('netTotalDisplay').textContent = net.toFixed(2);
            const tender = parseFloat(document.getElementById('tenderCash').value) || 0;
            document.getElementById('changeCash').value = (tender - net).toFixed(2);
            return net;
        }

        function updateNepaliDate() {
            const englishDate = document.getElementById('billDate').value;
            if (englishDate) {
                const nepaliDate = englishToNepali(englishDate);
                document.getElementById('miti').value = nepaliDate;
            }
        }

        window.addItem = function() {
            const container = document.getElementById('itemsContainer');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <div class="form-group mid"><label>Particulars</label><input class="item-particulars" placeholder="Item description" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Qty</label><input class="item-qty" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Rate</label><input class="item-rate" type="number" step="0.01" value="" autocomplete="off"></div>
                <div class="form-group small"><label>Amount</label><input class="item-amount" type="number" step="0.01" readonly style="background:#eef4f0;" value="0.00"></div>
                <button class="remove-item" onclick="removeItem(this)"><i class="fas fa-trash-alt"></i></button>
            `;
            container.appendChild(row);
            row.querySelectorAll('.item-qty, .item-rate').forEach(inp => {
                inp.addEventListener('input', function() { updateNetAndChange(); updatePreview(); });
            });
            row.querySelector('.item-particulars').addEventListener('input', updatePreview);
            updateNetAndChange();
            updatePreview();
        };

        window.removeItem = function(btn) {
            const row = btn.closest('.item-row');
            if (document.querySelectorAll('.item-row').length > 1) {
                row.remove();
                updateNetAndChange();
                updatePreview();
            } else { alert('At least one item is required.'); }
        };

        function attachInputEvents() {
            document.querySelectorAll('.item-row').forEach(row => {
                row.querySelectorAll('.item-qty, .item-rate').forEach(inp => {
                    inp.addEventListener('input', function() { updateNetAndChange(); updatePreview(); });
                });
                row.querySelector('.item-particulars').addEventListener('input', updatePreview);
            });
            document.getElementById('tenderCash').addEventListener('input', function() { updateNetAndChange(); updatePreview(); });
            document.querySelectorAll('#billNo, #billDate, #miti, #custName, #custAddress, #panNo, #paymentMode, #cashierName').forEach(el => {
                el.addEventListener('input', updatePreview);
            });
            document.getElementById('paymentMode').addEventListener('change', updatePreview);
            
            // Date change handler
            document.getElementById('billDate').addEventListener('change', function() {
                updateNepaliDate();
                updatePreview();
            });
        }

        function updatePreview() {
            const net = updateNetAndChange();
            const billNo = document.getElementById('billNo').value || 'SI51942-CHR-82/83';
            const date = document.getElementById('billDate').value || '2026-02-07';
            const miti = document.getElementById('miti').value || '2082-10-25';
            const name = document.getElementById('custName').value || ' ';
            const address = document.getElementById('custAddress').value || ' ';
            const pan = document.getElementById('panNo').value || ' ';
            const payment = document.getElementById('paymentMode').value || 'Cash';
            const cashier = document.getElementById('cashierName').value || 'Bikram Thapa';
            const tender = parseFloat(document.getElementById('tenderCash').value) || 0;
            const change = parseFloat(document.getElementById('changeCash').value) || 0;

            const displayDate = date ? formatDisplayDate(date) : '07/02/2026';
            const displayMiti = miti ? formatDisplayDate(miti) : '18/03/2083';

            let itemsHtml = '';
            let gross = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                const particulars = row.querySelector('.item-particulars').value || '—';
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const amt = qty * rate;
                gross += amt;
                itemsHtml += `<tr><td>${particulars}</td><td>${qty.toFixed(2)}</td><td>${rate.toFixed(2)}</td><td class="amount-col">${amt.toFixed(2)}</td></tr>`;
            });

            const words = numberToWords(gross);
            const preview = document.getElementById('invoice-preview');
            preview.innerHTML = `
                <div style="margin-bottom:6px;">
                    <div class="inv-store">BOX TOWN MART PVT. LTD.</div>
                    <div class="inv-address">Suryabinayak- 06, Bhaktapur</div>
                    <div class="inv-vat">VAT No. : 610502835</div>
                    <div class="inv-title">ABBREVIATED TAX INVOICE</div>
                </div>
                <div style="display:flex; flex-wrap:wrap; justify-content:space-between; border-bottom:1px solid #d0dce3; padding-bottom:6px; margin-bottom:8px; gap:4px;">
                    <span><strong>Bill No:</strong> ${billNo}</span>
                    <span><strong>Date :</strong> ${displayDate}</span>
                    <span><strong>Miti :</strong> ${displayMiti}</span>
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:8px 20px; font-size:0.9rem; margin:4px 0 6px;">
                    <span><strong>Name :</strong> ${name}</span>
                    <span><strong>Address :</strong> ${address}</span>
                    <span><strong>PAN No :</strong> ${pan}</span>
                    <span><strong>Payment Mode :</strong> ${payment}</span>
                </div>
                <table class="inv-table">
                    <thead><tr><th>Particulars</th><th>Qty</th><th>Rate</th><th class="amount-col">Amount</th></tr></thead>
                    <tbody>${itemsHtml}</tbody>
                </table>
                <div style="margin:6px 0;">
                    <div class="inv-row"><span>Gross Amount :</span><span>${gross.toFixed(2)}</span></div>
                    <div class="inv-row"><span>Discount :</span><span>0.00</span></div>
                    <div class="inv-row" style="font-weight:700; border-top:1px solid #1a3e2f; padding-top:4px;"><span>Net Amount :</span><span>${gross.toFixed(2)}</span></div>
                </div>
                <div class="inv-cash">
                    <span><strong>Tender :</strong> ${tender.toFixed(2)}</span>
                    <span><strong>Change :</strong> ${change.toFixed(2)}</span>
                </div>
                <div class="inv-amount-words"><i class="fas fa-pen-fancy"></i> Rs. ${words}</div>
                <div class="inv-footer">
                    <span>Counter : Bhaktapur</span>
                    <span>Cashier : ${cashier}</span>
                </div>
                <div style="text-align:center; font-size:0.75rem; color:#4b6a5a; margin-top:10px;">Thank you for visiting us.</div>
            `;
        }

        function numberToWords(n) {
            if (n === 0) return 'Zero only';
            const num = Math.round(n * 100) / 100;
            const whole = Math.floor(num);
            const frac = Math.round((num - whole) * 100);
            const units = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            
            function convert(h) {
                if (h < 20) return units[h];
                if (h < 100) return tens[Math.floor(h/10)] + (h%10 ? ' ' + units[h%10] : '');
                return units[Math.floor(h/100)] + ' Hundred' + (h%100 ? ' ' + convert(h%100) : '');
            }
            
            let res = '';
            let w = whole;
            
            if (w >= 1000) { 
                res += convert(Math.floor(w/1000)) + ' Thousand '; 
                w %= 1000; 
            }
            if (w > 0) res += convert(w) + ' ';
            
            if (frac > 0) {
                res += 'and ' + frac + ' Paisa only';
            } else {
                res += 'only';
            }
            
            return res.trim();
        }

        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            const element = document.getElementById('invoice-preview');
            const downloadBtn = this;
            const originalText = downloadBtn.innerHTML;
            
            downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF...';
            downloadBtn.disabled = true;
            
            const contentWidth = element.scrollWidth;
            const contentHeight = element.scrollHeight;
            
            const a5Width = 5.83;
            const a5Height = 8.27;
            
            const margin = 0.2;
            const maxWidth = a5Width - (margin * 2);
            const maxHeight = a5Height - (margin * 2);
            
            const fontSize = parseFloat(window.getComputedStyle(element).fontSize);
            
            const widthScale = maxWidth / (contentWidth / 96);
            const heightScale = maxHeight / (contentHeight / 96);
            const scale = Math.min(1, Math.min(widthScale, heightScale) * 1.1);
            
            let pdfFontSize = fontSize;
            if (scale < 0.8) {
                pdfFontSize = fontSize * scale;
            }
            
            const originalFontSize = element.style.fontSize;
            if (pdfFontSize < fontSize) {
                element.style.fontSize = pdfFontSize + 'px';
            }
            
            const opt = {
                margin: [margin, margin, margin, margin],
                filename: 'Box_Town_Mart_Invoice_A5.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 2, 
                    letterRendering: true, 
                    useCORS: true,
                    width: element.scrollWidth,
                    height: element.scrollHeight,
                    logging: false
                },
                jsPDF: { 
                    unit: 'in', 
                    format: 'a5', 
                    orientation: 'portrait',
                    compress: true
                },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };
            
            html2pdf()
                .set(opt)
                .from(element)
                .save()
                .then(function() {
                    if (pdfFontSize < fontSize) {
                        element.style.fontSize = originalFontSize || '';
                    }
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.disabled = false;
                })
                .catch(function(error) {
                    console.error('PDF generation error:', error);
                    if (pdfFontSize < fontSize) {
                        element.style.fontSize = originalFontSize || '';
                    }
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.disabled = false;
                    alert('Error generating PDF. Please try again.');
                });
        });

        // Initialize
        document.querySelectorAll('.item-particulars, .item-qty, .item-rate').forEach(el => {
            el.value = '';
        });
        
        // Set initial date
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('billDate').value = `${year}-${month}-${day}`;
        
        // Set initial Nepali date
        updateNepaliDate();
        
        attachInputEvents();
        updateNetAndChange();
        updatePreview();
        
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                updatePreview();
            }, 250);
        });
    })();
</script>
</body>
</html>
